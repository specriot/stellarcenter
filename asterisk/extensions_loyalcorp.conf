; =============================================================================
; LoyalCorp P1 — Asterisk Dialplan
; Add to /etc/asterisk/extensions.conf:
;   #include extensions_loyalcorp.conf
; =============================================================================

[loyalcorp-p1-ivr]

; -----------------------------------------------------------------------------
; Outbound call entry — plays intro, waits for DTMF press-1
; Variables passed from bot:
;   CALL_ID, CAMPAIGN_ID, CAMPAIGN_DATA_ID, VOICE_FILE, OUTRO_FILE, WEBHOOK_URL
; -----------------------------------------------------------------------------
exten => _1XXXXXXXXXX,1,NoOp(LoyalCorp P1 call started: ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)

 ; AMD — Answering Machine Detection
 same => n,AMD()
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine)

 ; Play intro voice file
 same => n,Playback(${VOICE_FILE})

 ; Wait for DTMF — 5 seconds
 same => n,Read(DTMF_DIGIT,,1,,,5)

 ; Check if press-1
 same => n,GotoIf($["${DTMF_DIGIT}" = "1"]?pressed1)

 ; No press — send webhook and hangup
 same => n,Set(RESULT=${CURL(${WEBHOOK_URL}/webhook/dtmf,call_id=${CALL_ID}&digit=${DTMF_DIGIT}&duration=${ANSWEREDTIME}&campaign_id=${CAMPAIGN_ID}&campaign_data_id=${CAMPAIGN_DATA_ID}&amd_status=)})
 same => n,Hangup()

 ; Press-1 branch
 same => n(pressed1),NoOp(Press-1 detected!)
 same => n,Set(RESULT=${CURL(${WEBHOOK_URL}/webhook/dtmf,call_id=${CALL_ID}&digit=1&duration=${ANSWEREDTIME}&campaign_id=${CAMPAIGN_ID}&campaign_data_id=${CAMPAIGN_DATA_ID}&amd_status=)})
 same => n,GotoIf($["${OUTRO_FILE}" = ""]?nooutro)
 same => n,Playback(${OUTRO_FILE})
 same => n(nooutro),Hangup()

 ; Machine branch
 same => n(machine),NoOp(AMD: Machine detected)
 same => n,Set(RESULT=${CURL(${WEBHOOK_URL}/webhook/dtmf,call_id=${CALL_ID}&digit=&duration=0&campaign_id=${CAMPAIGN_ID}&campaign_data_id=${CAMPAIGN_DATA_ID}&amd_status=MACHINE)})
 same => n,Hangup()

; Hangup handler — sends hangup event to bot
exten => h,1,NoOp(Hangup: ${HANGUPCAUSE})
 same => n,Set(RESULT=${CURL(${WEBHOOK_URL}/webhook/hangup,call_id=${CALL_ID}&duration=${ANSWEREDTIME}&hangup_cause=${HANGUPCAUSE}&campaign_id=${CAMPAIGN_ID}&campaign_data_id=${CAMPAIGN_DATA_ID})})
 same => n,Hangup()