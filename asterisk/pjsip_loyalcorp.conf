; =============================================================================
; LoyalCorp P1 — Asterisk PJSIP Configuration
; Include this file in pjsip.conf:
;   #include pjsip_loyalcorp.conf
; =============================================================================

; -----------------------------------------------------------------------------
; Transport
; -----------------------------------------------------------------------------
[loyalcorp-transport]
type=transport
protocol=udp
bind=0.0.0.0:5060

; -----------------------------------------------------------------------------
; Global Trunk Registration (Outbound)
; -----------------------------------------------------------------------------
[loyalcorp-registration]
type=registration
transport=loyalcorp-transport
outbound_auth=loyalcorp-auth
server_uri=sip:YOUR_SIP_PROVIDER_HOST
client_uri=sip:YOUR_SIP_USERNAME@YOUR_SIP_PROVIDER_HOST
retry_interval=60
max_retries=10
contact_user=YOUR_SIP_USERNAME

; -----------------------------------------------------------------------------
; Authentication
; -----------------------------------------------------------------------------
[loyalcorp-auth]
type=auth
auth_type=userpass
username=YOUR_SIP_USERNAME
password=YOUR_SIP_PASSWORD

; -----------------------------------------------------------------------------
; AOR (Address of Record)
; -----------------------------------------------------------------------------
[loyalcorp-aor]
type=aor
contact=sip:YOUR_SIP_PROVIDER_HOST
qualify_frequency=60

; -----------------------------------------------------------------------------
; Endpoint — loyalcorp_trunk
; This is the single endpoint used by the bot (PJSIP_ENDPOINT in config.py)
; -----------------------------------------------------------------------------
[loyalcorp_trunk]
type=endpoint
transport=loyalcorp-transport
context=loyalcorp-p1-ivr
disallow=all
allow=ulaw
allow=alaw
outbound_auth=loyalcorp-auth
outbound_proxy=sip:YOUR_SIP_PROVIDER_HOST\;lr
from_user=YOUR_SIP_USERNAME
from_domain=YOUR_SIP_PROVIDER_HOST
aors=loyalcorp-aor
direct_media=no
trust_id_inbound=yes
send_pai=yes
callerid_privacy=allowed_not_screened